name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CODEX_PACKAGE: ${{ github.event_name == 'schedule' && '@openai/codex@latest' || '@openai/codex@0.149.1' }}

jobs:
  windows:
    name: Windows clean-home round trip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install validation runtime
        shell: pwsh
        run: |
          npm install --global $env:CODEX_PACKAGE
          codex --version

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath ./scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_ }
            }
          }
          if ($failed) { throw 'PowerShell parsing failed.' }

      - name: Validate installer behavior
        shell: pwsh
        run: |
          $cleanHome = Join-Path $env:RUNNER_TEMP 'task-aware-clean'
          & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $cleanHome
          & ./scripts/Test-TaskAwareAgent.ps1 -CodexHome $cleanHome -ConfigOnlyRuntime
          & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $cleanHome
          $backupCount = @(Get-ChildItem -Directory -LiteralPath (Join-Path $cleanHome 'task-aware-backups')).Count
          if ($backupCount -lt 2) { throw 'Repeated installation reused a backup directory.' }

          $standardHome = Join-Path $env:RUNNER_TEMP 'task-aware-standard-defaults'
          New-Item -ItemType Directory -Force -Path $standardHome | Out-Null
          @(
            'model = "parent-model"'
            'model_reasoning_effort = "medium"'
            'approval_policy = "on-request"'
            'sandbox_mode = "workspace-write"'
          ) | Set-Content -LiteralPath (Join-Path $standardHome 'config.toml') -Encoding utf8
          & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $standardHome
          $standard = Get-Content -Raw -LiteralPath (Join-Path $standardHome 'config.toml')
          foreach ($expected in @(
            'model = "parent-model"',
            'model_reasoning_effort = "medium"',
            'approval_policy = "on-request"',
            'sandbox_mode = "workspace-write"'
          )) {
            $key = $expected.Split('=')[0].Trim()
            if ([regex]::Matches($standard, "(?m)^\s*" + [regex]::Escape($key) + '\s*=').Count -ne 1 -or
                $standard -notmatch [regex]::Escape($expected)) {
              throw "Standard install changed $expected."
            }
          }

          $astraHome = Join-Path $env:RUNNER_TEMP 'task-aware-astra-default'
          & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $astraHome -SetAstraDefault
          & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $astraHome -SetAstraDefault
          & ./scripts/Test-TaskAwareAgent.ps1 -CodexHome $astraHome -ConfigOnlyRuntime
          $astra = Get-Content -Raw -LiteralPath (Join-Path $astraHome 'config.toml')
          foreach ($expected in @('model = "gpt-6-astra"', 'model_reasoning_effort = "xhigh"')) {
            if ([regex]::Matches($astra, "(?m)^\s*" + [regex]::Escape($expected.Split('=')[0].Trim()) + '\s*=').Count -ne 1 -or
                $astra -notmatch [regex]::Escape($expected)) {
              throw "Astra default was not set exactly once: $expected."
            }
          }

          $retiredSolHome = Join-Path $env:RUNNER_TEMP 'task-aware-retired-sol'
          $stopped = $false
          try {
            & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $retiredSolHome -SetSolDefault -ErrorAction Stop
          }
          catch {
            $stopped = $_.Exception.Message -like '*was retired*'
          }
          if (-not $stopped -or (Test-Path -LiteralPath $retiredSolHome)) {
            throw 'Retired Sol option did not fail before filesystem mutation.'
          }

          $astraSolConflictHome = Join-Path $env:RUNNER_TEMP 'task-aware-astra-sol-conflict'
          $stopped = $false
          try {
            & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $astraSolConflictHome `
              -SetAstraDefault -SetSolDefault -WhatIf -ErrorAction Stop
          }
          catch {
            $stopped = $true
          }
          if (-not $stopped -or (Test-Path -LiteralPath $astraSolConflictHome)) {
            throw 'Conflicting Astra and Sol options did not fail before filesystem mutation.'
          }

          $migrationHome = Join-Path $env:RUNNER_TEMP 'task-aware-migration'
          New-Item -ItemType Directory -Force -Path $migrationHome | Out-Null
          $migrationConfig = @(
            '[features] # legacy feature section'
            '  multi_agent = true'
            ''
            '[agents] # preserve this user comment'
            '  enabled = false'
            '  max_concurrent_threads_per_session = 9'
            '  max_threads = 4'
            '  max_depth = 1'
            ''
          ) -join "`r`n"
          [IO.File]::WriteAllText(
            (Join-Path $migrationHome 'config.toml'),
            $migrationConfig,
            [Text.UTF8Encoding]::new($false)
          )
          & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $migrationHome
          $migrated = Get-Content -Raw -LiteralPath (Join-Path $migrationHome 'config.toml')
          if ($migrated -match '(?m)^\s*(multi_agent|max_threads|max_depth)\s*=') {
            throw 'A legacy multi-agent key remained after migration.'
          }
          if ([regex]::Matches($migrated, '(?m)^\s*\[agents\]\s*(?:#.*)?$').Count -ne 1) {
            throw 'The agents table was duplicated during migration.'
          }
          if ([regex]::Matches($migrated, '(?m)^\s*enabled\s*=').Count -ne 1) {
            throw 'The enabled key was duplicated during migration.'
          }
          if ([regex]::Matches($migrated, '(?m)^\s*max_concurrent_threads_per_session\s*=').Count -ne 1) {
            throw 'The thread limit key was duplicated during migration.'
          }
          & ./scripts/Test-TaskAwareAgent.ps1 -CodexHome $migrationHome -ConfigOnlyRuntime

          $conflictHome = Join-Path $env:RUNNER_TEMP 'task-aware-conflict'
          New-Item -ItemType Directory -Force -Path $conflictHome | Out-Null
          'default_permissions = ":workspace"' |
            Set-Content -LiteralPath (Join-Path $conflictHome 'config.toml') -Encoding utf8
          $stopped = $false
          try {
            & ./scripts/Install-TaskAwareAgent.ps1 `
              -CodexHome $conflictHome -EnableFullAccess -ErrorAction Stop
          }
          catch {
            $stopped = $true
          }
          if (-not $stopped) { throw 'The permission conflict was not rejected.' }

          $malformedHome = Join-Path $env:RUNNER_TEMP 'task-aware-malformed-markers'
          New-Item -ItemType Directory -Force -Path $malformedHome | Out-Null
          '<!-- BEGIN CODEX TASK-AWARE AGENT -->' |
            Set-Content -LiteralPath (Join-Path $malformedHome 'AGENTS.md') -Encoding utf8
          $stopped = $false
          try {
            & ./scripts/Install-TaskAwareAgent.ps1 `
              -CodexHome $malformedHome -ErrorAction Stop
          }
          catch {
            $stopped = $true
          }
          if (-not $stopped) { throw 'Malformed AGENTS.md markers were not rejected.' }

  linux:
    name: Linux clean-home round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install validation runtime
        run: |
          npm install --global "$CODEX_PACKAGE"
          codex --version

      - name: Parse Bash scripts
        run: |
          bash -n scripts/install-task-aware-agent.sh
          bash -n scripts/test-task-aware-agent.sh
          shellcheck -S warning \
            scripts/install-task-aware-agent.sh \
            scripts/test-task-aware-agent.sh

      - name: Validate installer behavior
        run: |
          set -Eeuo pipefail

          clean_home="$RUNNER_TEMP/task-aware-clean"
          scripts/install-task-aware-agent.sh --codex-home "$clean_home"
          scripts/test-task-aware-agent.sh \
            --codex-home "$clean_home" \
            --config-only-runtime
          scripts/install-task-aware-agent.sh --codex-home "$clean_home"
          backup_count=$(find "$clean_home/task-aware-backups" -mindepth 1 -maxdepth 1 -type d | wc -l)
          if ((backup_count < 2)); then
            printf '%s\n' 'Repeated installation reused a backup directory.' >&2
            exit 1
          fi

          standard_home="$RUNNER_TEMP/task-aware-standard-defaults"
          mkdir -p -- "$standard_home"
          cat > "$standard_home/config.toml" <<'EOF'
          model = "parent-model"
          model_reasoning_effort = "medium"
          approval_policy = "on-request"
          sandbox_mode = "workspace-write"
          EOF
          scripts/install-task-aware-agent.sh --codex-home "$standard_home"
          for expected in \
            'model = "parent-model"' \
            'model_reasoning_effort = "medium"' \
            'approval_policy = "on-request"' \
            'sandbox_mode = "workspace-write"'; do
            key=${expected%% =*}
            if [[ $(grep -Ec "^[[:space:]]*$key[[:space:]]*=" "$standard_home/config.toml") -ne 1 ]] ||
              ! grep -Fqx "$expected" "$standard_home/config.toml"; then
              printf 'Standard install changed %s.\n' "$expected" >&2
              exit 1
            fi
          done

          astra_home="$RUNNER_TEMP/task-aware-astra-default"
          scripts/install-task-aware-agent.sh --codex-home "$astra_home" --set-astra-default
          scripts/install-task-aware-agent.sh --codex-home "$astra_home" --set-astra-default
          scripts/test-task-aware-agent.sh --codex-home "$astra_home" --config-only-runtime
          for expected in \
            'model = "gpt-6-astra"' \
            'model_reasoning_effort = "xhigh"'; do
            key=${expected%% =*}
            if [[ $(grep -Ec "^[[:space:]]*$key[[:space:]]*=" "$astra_home/config.toml") -ne 1 ]] ||
              ! grep -Fqx "$expected" "$astra_home/config.toml"; then
              printf 'Astra default was not set exactly once: %s.\n' "$expected" >&2
              exit 1
            fi
          done

          retired_sol_home="$RUNNER_TEMP/task-aware-retired-sol"
          if scripts/install-task-aware-agent.sh --codex-home "$retired_sol_home" --set-sol-default; then
            printf '%s\n' 'Retired Sol option was not rejected.' >&2
            exit 1
          fi
          if [[ -e "$retired_sol_home" ]]; then
            printf '%s\n' 'Retired Sol option mutated the target home.' >&2
            exit 1
          fi

          astra_sol_conflict_home="$RUNNER_TEMP/task-aware-astra-sol-conflict"
          if scripts/install-task-aware-agent.sh --codex-home "$astra_sol_conflict_home" \
            --set-astra-default --set-sol-default; then
            printf '%s\n' 'Conflicting Astra and Sol options were not rejected.' >&2
            exit 1
          fi
          if [[ -e "$astra_sol_conflict_home" ]]; then
            printf '%s\n' 'Conflicting options mutated the target home.' >&2
            exit 1
          fi

          migration_home="$RUNNER_TEMP/task-aware-migration"
          mkdir -p -- "$migration_home"
          cat > "$migration_home/config.toml" <<'EOF'
          [features] # legacy feature section
            multi_agent = true

          [agents] # preserve this user comment
            enabled = false
            max_concurrent_threads_per_session = 9
            max_threads = 4
            max_depth = 1
          EOF
          scripts/install-task-aware-agent.sh --codex-home "$migration_home"
          if grep -Eq '^[[:space:]]*(multi_agent|max_threads|max_depth)[[:space:]]*=' \
            "$migration_home/config.toml"; then
            printf '%s\n' 'A legacy multi-agent key remained after migration.' >&2
            exit 1
          fi
          if [[ $(grep -Ec '^[[:space:]]*\[agents\][[:space:]]*(#.*)?$' "$migration_home/config.toml") -ne 1 ]]; then
            printf '%s\n' 'The agents table was duplicated during migration.' >&2
            exit 1
          fi
          if [[ $(grep -Ec '^[[:space:]]*enabled[[:space:]]*=' "$migration_home/config.toml") -ne 1 ]]; then
            printf '%s\n' 'The enabled key was duplicated during migration.' >&2
            exit 1
          fi
          if [[ $(grep -Ec '^[[:space:]]*max_concurrent_threads_per_session[[:space:]]*=' "$migration_home/config.toml") -ne 1 ]]; then
            printf '%s\n' 'The thread limit key was duplicated during migration.' >&2
            exit 1
          fi
          scripts/test-task-aware-agent.sh \
            --codex-home "$migration_home" \
            --config-only-runtime

          conflict_home="$RUNNER_TEMP/task-aware-conflict"
          mkdir -p -- "$conflict_home"
          printf '%s\n' 'default_permissions = ":workspace"' > "$conflict_home/config.toml"
          if scripts/install-task-aware-agent.sh \
            --codex-home "$conflict_home" \
            --enable-full-access; then
            printf '%s\n' 'The permission conflict was not rejected.' >&2
            exit 1
          fi

          malformed_home="$RUNNER_TEMP/task-aware-malformed-markers"
          mkdir -p -- "$malformed_home"
          printf '%s\n' '<!-- BEGIN CODEX TASK-AWARE AGENT -->' > "$malformed_home/AGENTS.md"
          if scripts/install-task-aware-agent.sh --codex-home "$malformed_home"; then
            printf '%s\n' 'Malformed AGENTS.md markers were not rejected.' >&2
            exit 1
          fi
