name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CODEX_PACKAGE: ${{ github.event_name == 'schedule' && '@openai/codex@latest' || '@openai/codex@0.149.1' }}

jobs:
  windows:
    name: Windows clean-home round trip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install validation runtime
        shell: pwsh
        run: |
          npm install --global $env:CODEX_PACKAGE
          codex --version

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath ./scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_ }
            }
          }
          if ($failed) { throw 'PowerShell parsing failed.' }

      - name: Validate installer behavior
        shell: pwsh
        run: |
          $cleanHome = Join-Path $env:RUNNER_TEMP 'task-aware-clean'
          & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $cleanHome
          & ./scripts/Test-TaskAwareAgent.ps1 -CodexHome $cleanHome -ConfigOnlyRuntime
          & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $cleanHome
          $backupCount = @(Get-ChildItem -Directory -LiteralPath (Join-Path $cleanHome 'task-aware-backups')).Count
          if ($backupCount -lt 2) { throw 'Repeated installation reused a backup directory.' }

          $standardHome = Join-Path $env:RUNNER_TEMP 'task-aware-standard-defaults'
          New-Item -ItemType Directory -Force -Path $standardHome | Out-Null
          @(
            'model = "parent-model"'
            'model_reasoning_effort = "medium"'
            'approval_policy = "on-request"'
            'sandbox_mode = "workspace-write"'
          ) | Set-Content -LiteralPath (Join-Path $standardHome 'config.toml') -Encoding utf8
          & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $standardHome
          $standard = Get-Content -Raw -LiteralPath (Join-Path $standardHome 'config.toml')
          foreach ($expected in @(
            'model = "parent-model"',
            'model_reasoning_effort = "medium"',
            'approval_policy = "on-request"',
            'sandbox_mode = "workspace-write"'
          )) {
            $key = $expected.Split('=')[0].Trim()
            if ([regex]::Matches($standard, "(?m)^\s*" + [regex]::Escape($key) + '\s*=').Count -ne 1 -or
                $standard -notmatch [regex]::Escape($expected)) {
              throw "Standard install changed $expected."
            }
          }

          $astraHome = Join-Path $env:RUNNER_TEMP 'task-aware-astra-default'
          & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $astraHome -SetAstraDefault
          & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $astraHome -SetAstraDefault
          & ./scripts/Test-TaskAwareAgent.ps1 -CodexHome $astraHome -ConfigOnlyRuntime
          $astra = Get-Content -Raw -LiteralPath (Join-Path $astraHome 'config.toml')
          foreach ($expected in @('model = "gpt-6-astra"', 'model_reasoning_effort = "xhigh"')) {
            if ([regex]::Matches($astra, "(?m)^\s*" + [regex]::Escape($expected.Split('=')[0].Trim()) + '\s*=').Count -ne 1 -or
                $astra -notmatch [regex]::Escape($expected)) {
              throw "Astra default was not set exactly once: $expected."
            }
          }

          $retiredSolHome = Join-Path $env:RUNNER_TEMP 'task-aware-retired-sol'
          $stopped = $false
          try {
            & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $retiredSolHome -SetSolDefault -ErrorAction Stop
          }
          catch {
            $stopped = $_.Exception.Message -like '*was retired*'
          }
          if (-not $stopped -or (Test-Path -LiteralPath $retiredSolHome)) {
            throw 'Retired Sol option did not fail before filesystem mutation.'
          }

          $migrationHome = Join-Path $env:RUNNER_TEMP 'task-aware-migration'
          New-Item -ItemType Directory -Force -Path $migrationHome | Out-Null
          $migrationConfig = @(
            '[features] # legacy feature section'
            '  multi_agent = true'
            ''
            '[agents] # preserve this user comment'
            '  enabled = false'
            '  max_concurrent_threads_per_session = 9'
            '  max_threads = 4'
            '  max_depth = 1'
            ''
          ) -join "`r`n"
          [IO.File]::WriteAllText(
            (Join-Path $migrationHome 'config.toml'),
            $migrationConfig,
            [Text.UTF8Encoding]::new($false)
          )
          & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $migrationHome
          $migrated = Get-Content -Raw -LiteralPath (Join-Path $migrationHome 'config.toml')
          if ($migrated -match '(?m)^\s*(multi_agent|max_threads|max_depth)\s*=') {
            throw 'A legacy multi-agent key remained after migration.'
          }
          if ([regex]::Matches($migrated, '(?m)^\s*\[agents\]\s*(?:#.*)?$').Count -ne 1) {
            throw 'The agents table was duplicated during migration.'
          }
          if ([regex]::Matches($migrated, '(?m)^\s*enabled\s*=').Count -ne 1) {
            throw 'The enabled key was duplicated during migration.'
          }
          if ([regex]::Matches($migrated, '(?m)^\s*max_concurrent_threads_per_session\s*=').Count -ne 1) {
            throw 'The thread limit key was duplicated during migration.'
          }
          & ./scripts/Test-TaskAwareAgent.ps1 -CodexHome $migrationHome -ConfigOnlyRuntime

          $conflictHome = Join-Path $env:RUNNER_TEMP 'task-aware-conflict'
          New-Item -ItemType Directory -Force -Path $conflictHome | Out-Null
          'default_permissions = ":workspace"' |
            Set-Content -LiteralPath (Join-Path $conflictHome 'config.toml') -Encoding utf8
          $stopped = $false
          try {
            & ./scripts/Install-TaskAwareAgent.ps1 `
              -CodexHome $conflictHome -EnableFullAccess -ErrorAction Stop
          }
          catch {
            $stopped = $true
          }
          if (-not $stopped) { throw 'The permission conflict was not rejected.' }

          $malformedHome = Join-Path $env:RUNNER_TEMP 'task-aware-malformed-markers'
          New-Item -ItemType Directory -Force -Path $malformedHome | Out-Null
          '<!-- BEGIN CODEX TASK-AWARE AGENT -->' |
            Set-Content -LiteralPath (Join-Path $malformedHome 'AGENTS.md') -Encoding utf8
          $stopped = $false
          try {
            & ./scripts/Install-TaskAwareAgent.ps1 `
              -CodexHome $malformedHome -ErrorAction Stop
          }
          catch {
            $stopped = $true
          }
          if (-not $stopped) { throw 'Malformed AGENTS.md markers were not rejected.' }

          $literalMarkerHome = Join-Path $env:RUNNER_TEMP 'task-aware-literal-markers'
          New-Item -ItemType Directory -Force -Path $literalMarkerHome | Out-Null
          $literalMarkerLine = 'User text: <!-- BEGIN CODEX TASK-AWARE AGENT --> and <!-- END CODEX TASK-AWARE AGENT --> are examples.'
          [IO.File]::WriteAllText(
            (Join-Path $literalMarkerHome 'AGENTS.md'),
            $literalMarkerLine + "`n",
            [Text.UTF8Encoding]::new($false)
          )
          & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $literalMarkerHome
          & ./scripts/Test-TaskAwareAgent.ps1 -CodexHome $literalMarkerHome -SkipRuntime
          if ((Get-Content -Raw -LiteralPath (Join-Path $literalMarkerHome 'AGENTS.md')) -notmatch [regex]::Escape($literalMarkerLine)) {
            throw 'Inline marker examples were not preserved.'
          }

          $preserveHome = Join-Path $env:RUNNER_TEMP 'task-aware-preserve'
          New-Item -ItemType Directory -Force -Path $preserveHome | Out-Null
          $preserveConfig = @(
            'model = "gpt-6-astra"'
            'model_reasoning_effort = "max"'
            'approval_policy = "never"'
            'sandbox_mode = "workspace-write"'
            'unmanaged_setting = "retain-me"'
          ) -join "`n"
          [IO.File]::WriteAllText(
            (Join-Path $preserveHome 'config.toml'),
            $preserveConfig,
            [Text.UTF8Encoding]::new($false)
          )
          & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $preserveHome
          $preserved = Get-Content -Raw -LiteralPath (Join-Path $preserveHome 'config.toml')
          foreach ($line in @(
              'model = "gpt-6-astra"'
              'model_reasoning_effort = "max"'
              'approval_policy = "never"'
              'sandbox_mode = "workspace-write"'
              'unmanaged_setting = "retain-me"'
            )) {
            if ($preserved -notmatch [regex]::Escape($line)) {
              throw "Default installation did not preserve: $line"
            }
          }

          $selectionConflictHome = Join-Path $env:RUNNER_TEMP 'task-aware-selection-conflict'
          New-Item -ItemType Directory -Force -Path $selectionConflictHome | Out-Null
          $selectionConfigPath = Join-Path $selectionConflictHome 'config.toml'
          [IO.File]::WriteAllText(
            $selectionConfigPath,
            "model = ""preserve""`n",
            [Text.UTF8Encoding]::new($false)
          )
          $beforeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $selectionConfigPath).Hash
          $stopped = $false
          try {
            & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $selectionConflictHome -SetSolDefault -SetAstraDefault -ErrorAction Stop
          }
          catch {
            $stopped = $true
          }
          if (-not $stopped) { throw 'Conflicting parent model switches were accepted.' }
          $afterHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $selectionConfigPath).Hash
          if ($beforeHash -cne $afterHash) { throw 'Conflicting parent model switches mutated config.toml.' }
          foreach ($path in @('task-aware-backups', 'agents', 'rules', 'AGENTS.md')) {
            if (Test-Path -LiteralPath (Join-Path $selectionConflictHome $path)) {
              throw "Conflicting parent model switches created $path."
            }
          }

          foreach ($markerCase in @('duplicate', 'reversed')) {
            $markerHome = Join-Path $env:RUNNER_TEMP "task-aware-markers-$markerCase"
            New-Item -ItemType Directory -Force -Path $markerHome | Out-Null
            $markerContent = switch ($markerCase) {
              'duplicate' {
                "<!-- BEGIN CODEX TASK-AWARE AGENT -->`n<!-- END CODEX TASK-AWARE AGENT -->`n<!-- BEGIN CODEX TASK-AWARE AGENT -->`n<!-- END CODEX TASK-AWARE AGENT -->`n"
              }
              default {
                "<!-- END CODEX TASK-AWARE AGENT -->`n<!-- BEGIN CODEX TASK-AWARE AGENT -->`n"
              }
            }
            [IO.File]::WriteAllText((Join-Path $markerHome 'AGENTS.md'), $markerContent, [Text.UTF8Encoding]::new($false))
            $stopped = $false
            try {
              & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $markerHome -ErrorAction Stop
            }
            catch {
              $stopped = $true
            }
            if (-not $stopped) { throw "Marker case unexpectedly succeeded: $markerCase" }
          }

          $crlfHome = Join-Path $env:RUNNER_TEMP 'task-aware-crlf'
          New-Item -ItemType Directory -Force -Path $crlfHome | Out-Null
          $policy = Get-Content -Raw -LiteralPath ./config/AGENTS.task-aware.md
          $crlfPolicy = [regex]::Replace($policy, "`r?`n", "`r`n")
          [IO.File]::WriteAllText((Join-Path $crlfHome 'AGENTS.md'), $crlfPolicy, [Text.UTF8Encoding]::new($false))
          & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $crlfHome
          & ./scripts/Test-TaskAwareAgent.ps1 -CodexHome $crlfHome -SkipRuntime

          foreach ($drift in @('policy', 'role', 'rule')) {
            $driftHome = Join-Path $env:RUNNER_TEMP "task-aware-drift-$drift"
            & ./scripts/Install-TaskAwareAgent.ps1 -CodexHome $driftHome
            switch ($drift) {
              'policy' {
                $driftPath = Join-Path $driftHome 'AGENTS.md'
                $driftContent = Get-Content -Raw -LiteralPath $driftPath
                $driftContent = $driftContent.Replace(
                  '<!-- END CODEX TASK-AWARE AGENT -->',
                  "# drift`n<!-- END CODEX TASK-AWARE AGENT -->"
                )
                [IO.File]::WriteAllText($driftPath, $driftContent, [Text.UTF8Encoding]::new($false))
              }
              'role' {
                [IO.File]::AppendAllText(
                  (Join-Path $driftHome 'agents/luna-task.toml'),
                  "# drift`n",
                  [Text.UTF8Encoding]::new($false)
                )
              }
              'rule' {
                [IO.File]::AppendAllText(
                  (Join-Path $driftHome 'rules/task-aware-full-admin.rules'),
                  "# drift`n",
                  [Text.UTF8Encoding]::new($false)
                )
              }
            }
            $stopped = $false
            try {
              & ./scripts/Test-TaskAwareAgent.ps1 -CodexHome $driftHome -SkipRuntime -ErrorAction Stop
            }
            catch {
              $stopped = $true
            }
            if (-not $stopped) { throw "Drift case unexpectedly passed: $drift" }
          }

      - name: Reject oversized managed policy
        shell: pwsh
        run: |
          $budgetRepo = Join-Path $env:RUNNER_TEMP 'task-aware-budget-repo'
          $budgetHome = Join-Path $env:RUNNER_TEMP 'task-aware-budget-home'
          New-Item -ItemType Directory -Path $budgetRepo | Out-Null
          foreach ($directory in @('scripts', 'config', 'agents', 'rules')) {
            Copy-Item -LiteralPath $directory -Destination $budgetRepo -Recurse
          }
          $budgetSource = Join-Path $budgetRepo 'config/AGENTS.task-aware.md'
          $policy = Get-Content -Raw -LiteralPath $budgetSource
          $end = '<!-- END CODEX TASK-AWARE AGENT -->'
          $policy = $policy.Replace($end, "<!-- $('x' * 10240) -->`n$end")
          [IO.File]::WriteAllText($budgetSource, $policy, [Text.UTF8Encoding]::new($false))
          & (Join-Path $budgetRepo 'scripts/Install-TaskAwareAgent.ps1') -CodexHome $budgetHome
          $stopped = $false
          try {
            & (Join-Path $budgetRepo 'scripts/Test-TaskAwareAgent.ps1') -CodexHome $budgetHome -SkipRuntime
          }
          catch {
            if ($_.Exception.Message -notmatch 'Managed policy exceeds the 10 KiB maintenance budget') { throw }
            $stopped = $true
          }
          if (-not $stopped) { throw 'An oversized managed policy passed validation.' }

  linux:
    name: Linux clean-home round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install validation runtime
        run: |
          npm install --global "$CODEX_PACKAGE"
          codex --version

      - name: Parse Bash scripts
        run: |
          bash -n scripts/install-task-aware-agent.sh
          bash -n scripts/test-task-aware-agent.sh
          shellcheck -S warning \
            scripts/install-task-aware-agent.sh \
            scripts/test-task-aware-agent.sh

      - name: Validate installer behavior
        run: |
          set -Eeuo pipefail

          clean_home="$RUNNER_TEMP/task-aware-clean"
          scripts/install-task-aware-agent.sh --codex-home "$clean_home"
          scripts/test-task-aware-agent.sh \
            --codex-home "$clean_home" \
            --config-only-runtime
          scripts/install-task-aware-agent.sh --codex-home "$clean_home"
          backup_count=$(find "$clean_home/task-aware-backups" -mindepth 1 -maxdepth 1 -type d | wc -l)
          if ((backup_count < 2)); then
            printf '%s\n' 'Repeated installation reused a backup directory.' >&2
            exit 1
          fi

          standard_home="$RUNNER_TEMP/task-aware-standard-defaults"
          mkdir -p -- "$standard_home"
          cat > "$standard_home/config.toml" <<'EOF'
          model = "parent-model"
          model_reasoning_effort = "medium"
          approval_policy = "on-request"
          sandbox_mode = "workspace-write"
          EOF
          scripts/install-task-aware-agent.sh --codex-home "$standard_home"
          for expected in \
            'model = "parent-model"' \
            'model_reasoning_effort = "medium"' \
            'approval_policy = "on-request"' \
            'sandbox_mode = "workspace-write"'; do
            key=${expected%% =*}
            if [[ $(grep -Ec "^[[:space:]]*$key[[:space:]]*=" "$standard_home/config.toml") -ne 1 ]] ||
              ! grep -Fqx "$expected" "$standard_home/config.toml"; then
              printf 'Standard install changed %s.\n' "$expected" >&2
              exit 1
            fi
          done

          astra_home="$RUNNER_TEMP/task-aware-astra-default"
          scripts/install-task-aware-agent.sh --codex-home "$astra_home" --set-astra-default
          scripts/install-task-aware-agent.sh --codex-home "$astra_home" --set-astra-default
          scripts/test-task-aware-agent.sh --codex-home "$astra_home" --config-only-runtime
          for expected in \
            'model = "gpt-6-astra"' \
            'model_reasoning_effort = "xhigh"'; do
            key=${expected%% =*}
            if [[ $(grep -Ec "^[[:space:]]*$key[[:space:]]*=" "$astra_home/config.toml") -ne 1 ]] ||
              ! grep -Fqx "$expected" "$astra_home/config.toml"; then
              printf 'Astra default was not set exactly once: %s.\n' "$expected" >&2
              exit 1
            fi
          done

          retired_sol_home="$RUNNER_TEMP/task-aware-retired-sol"
          if scripts/install-task-aware-agent.sh --codex-home "$retired_sol_home" --set-sol-default; then
            printf '%s\n' 'Retired Sol option was not rejected.' >&2
            exit 1
          fi
          if [[ -e "$retired_sol_home" ]]; then
            printf '%s\n' 'Retired Sol option mutated the target home.' >&2
            exit 1
          fi

          migration_home="$RUNNER_TEMP/task-aware-migration"
          mkdir -p -- "$migration_home"
          cat > "$migration_home/config.toml" <<'EOF'
          [features] # legacy feature section
            multi_agent = true

          [agents] # preserve this user comment
            enabled = false
            max_concurrent_threads_per_session = 9
            max_threads = 4
            max_depth = 1
          EOF
          scripts/install-task-aware-agent.sh --codex-home "$migration_home"
          if grep -Eq '^[[:space:]]*(multi_agent|max_threads|max_depth)[[:space:]]*=' \
            "$migration_home/config.toml"; then
            printf '%s\n' 'A legacy multi-agent key remained after migration.' >&2
            exit 1
          fi
          if [[ $(grep -Ec '^[[:space:]]*\[agents\][[:space:]]*(#.*)?$' "$migration_home/config.toml") -ne 1 ]]; then
            printf '%s\n' 'The agents table was duplicated during migration.' >&2
            exit 1
          fi
          if [[ $(grep -Ec '^[[:space:]]*enabled[[:space:]]*=' "$migration_home/config.toml") -ne 1 ]]; then
            printf '%s\n' 'The enabled key was duplicated during migration.' >&2
            exit 1
          fi
          if [[ $(grep -Ec '^[[:space:]]*max_concurrent_threads_per_session[[:space:]]*=' "$migration_home/config.toml") -ne 1 ]]; then
            printf '%s\n' 'The thread limit key was duplicated during migration.' >&2
            exit 1
          fi
          scripts/test-task-aware-agent.sh \
            --codex-home "$migration_home" \
            --config-only-runtime

          conflict_home="$RUNNER_TEMP/task-aware-conflict"
          mkdir -p -- "$conflict_home"
          printf '%s\n' 'default_permissions = ":workspace"' > "$conflict_home/config.toml"
          if scripts/install-task-aware-agent.sh \
            --codex-home "$conflict_home" \
            --enable-full-access; then
            printf '%s\n' 'The permission conflict was not rejected.' >&2
            exit 1
          fi

          malformed_home="$RUNNER_TEMP/task-aware-malformed-markers"
          mkdir -p -- "$malformed_home"
          printf '%s\n' '<!-- BEGIN CODEX TASK-AWARE AGENT -->' > "$malformed_home/AGENTS.md"
          if scripts/install-task-aware-agent.sh --codex-home "$malformed_home"; then
            printf '%s\n' 'Malformed AGENTS.md markers were not rejected.' >&2
            exit 1
          fi

          literal_marker_home="$RUNNER_TEMP/task-aware-literal-markers"
          mkdir -p -- "$literal_marker_home"
          literal_marker_line='User text: <!-- BEGIN CODEX TASK-AWARE AGENT --> and <!-- END CODEX TASK-AWARE AGENT --> are examples.'
          printf '%s\n' "$literal_marker_line" > "$literal_marker_home/AGENTS.md"
          scripts/install-task-aware-agent.sh --codex-home "$literal_marker_home"
          scripts/test-task-aware-agent.sh \
            --codex-home "$literal_marker_home" \
            --skip-runtime
          if ! grep -Fqx -- "$literal_marker_line" "$literal_marker_home/AGENTS.md"; then
            printf '%s\n' 'Inline marker examples were not preserved.' >&2
            exit 1
          fi

          preserve_home="$RUNNER_TEMP/task-aware-preserve"
          mkdir -p -- "$preserve_home"
          printf '%s\n' \
            'model = "gpt-6-astra"' \
            'model_reasoning_effort = "max"' \
            'approval_policy = "never"' \
            'sandbox_mode = "workspace-write"' \
            'unmanaged_setting = "retain-me"' > "$preserve_home/config.toml"
          scripts/install-task-aware-agent.sh --codex-home "$preserve_home"
          for preserved_line in \
            'model = "gpt-6-astra"' \
            'model_reasoning_effort = "max"' \
            'approval_policy = "never"' \
            'sandbox_mode = "workspace-write"' \
            'unmanaged_setting = "retain-me"'; do
            if ! grep -Fqx -- "$preserved_line" "$preserve_home/config.toml"; then
              printf 'Default installation did not preserve: %s\n' "$preserved_line" >&2
              exit 1
            fi
          done

          selection_conflict_home="$RUNNER_TEMP/task-aware-selection-conflict"
          mkdir -p -- "$selection_conflict_home"
          printf '%s\n' 'model = "preserve"' > "$selection_conflict_home/config.toml"
          before_hash=$(sha256sum "$selection_conflict_home/config.toml" | awk '{print $1}')
          if scripts/install-task-aware-agent.sh \
            --codex-home "$selection_conflict_home" \
            --set-sol-default \
            --set-astra-default; then
            printf '%s\n' 'Conflicting parent model switches were accepted.' >&2
            exit 1
          fi
          after_hash=$(sha256sum "$selection_conflict_home/config.toml" | awk '{print $1}')
          if [[ "$before_hash" != "$after_hash" ]]; then
            printf '%s\n' 'Conflicting parent model switches mutated config.toml.' >&2
            exit 1
          fi
          for path in task-aware-backups agents rules AGENTS.md; do
            if [[ -e "$selection_conflict_home/$path" ]]; then
              printf 'Conflicting parent model switches created %s.\n' "$path" >&2
              exit 1
            fi
          done

          for marker_case in duplicate reversed; do
            marker_home="$RUNNER_TEMP/task-aware-markers-$marker_case"
            mkdir -p -- "$marker_home"
            if [[ "$marker_case" == duplicate ]]; then
              printf '%s\n' \
                '<!-- BEGIN CODEX TASK-AWARE AGENT -->' \
                '<!-- END CODEX TASK-AWARE AGENT -->' \
                '<!-- BEGIN CODEX TASK-AWARE AGENT -->' \
                '<!-- END CODEX TASK-AWARE AGENT -->' > "$marker_home/AGENTS.md"
            else
              printf '%s\n' \
                '<!-- END CODEX TASK-AWARE AGENT -->' \
                '<!-- BEGIN CODEX TASK-AWARE AGENT -->' > "$marker_home/AGENTS.md"
            fi
            if scripts/install-task-aware-agent.sh --codex-home "$marker_home"; then
              printf 'Marker case unexpectedly succeeded: %s\n' "$marker_case" >&2
              exit 1
            fi
          done

          crlf_home="$RUNNER_TEMP/task-aware-crlf"
          mkdir -p -- "$crlf_home"
          awk '{ printf "%s\r\n", $0 }' config/AGENTS.task-aware.md > "$crlf_home/AGENTS.md"
          scripts/install-task-aware-agent.sh --codex-home "$crlf_home"
          scripts/test-task-aware-agent.sh --codex-home "$crlf_home" --skip-runtime

          for drift in policy role rule; do
            drift_home="$RUNNER_TEMP/task-aware-drift-$drift"
            scripts/install-task-aware-agent.sh --codex-home "$drift_home"
            case "$drift" in
              policy)
                sed -i '/<!-- END CODEX TASK-AWARE AGENT -->/i# drift' "$drift_home/AGENTS.md"
                ;;
              role)
                printf '%s\n' '# drift' >> "$drift_home/agents/luna-task.toml"
                ;;
              rule)
                printf '%s\n' '# drift' >> "$drift_home/rules/task-aware-full-admin.rules"
                ;;
            esac
            if scripts/test-task-aware-agent.sh --codex-home "$drift_home" --skip-runtime; then
              printf 'Drift case unexpectedly passed: %s\n' "$drift" >&2
              exit 1
            fi
          done

      - name: Reject oversized managed policy
        run: |
          budget_repo="$RUNNER_TEMP/task-aware-budget-repo"
          budget_home="$RUNNER_TEMP/task-aware-budget-home"
          mkdir -p -- "$budget_repo"
          cp -R -- scripts config agents rules "$budget_repo/"
          budget_source="$budget_repo/config/AGENTS.task-aware.md"
          awk '
            /<!-- END CODEX TASK-AWARE AGENT -->/ {
              printf "<!-- "
              for (i = 0; i < 10240; i++) printf "x"
              print " -->"
            }
            { print }
          ' "$budget_source" > "$budget_source.tmp"
          mv -- "$budget_source.tmp" "$budget_source"
          "$budget_repo/scripts/install-task-aware-agent.sh" --codex-home "$budget_home"
          if "$budget_repo/scripts/test-task-aware-agent.sh" --codex-home "$budget_home" --skip-runtime > "$RUNNER_TEMP/budget-error.txt" 2>&1; then
            printf '%s\n' 'An oversized managed policy passed validation.' >&2
            exit 1
          fi
          grep -Fq 'Managed policy exceeds the 10 KiB maintenance budget' "$RUNNER_TEMP/budget-error.txt"
