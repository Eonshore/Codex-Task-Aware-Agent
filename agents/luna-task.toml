name = "luna_task"
description = """
Use as the default for compact, homogeneous D1 extraction, classification,
format conversion, repetitive checks, and bounded read-only investigation or
validation with fixed inputs, an explicit output contract, and an explicit
success condition. Use luna_task_medium for modest reconciliation across files
or formats; prefer luna_task_max for dense cross-checking, coverage-sensitive
validation, or numerous edge cases.
Do not use for material judgment, broad investigation, or state changes.
"""
model = "gpt-6-astra"
model_reasoning_effort = "low"
sandbox_mode = "read-only"

developer_instructions = """
Handle exactly one bounded task.
Do not broaden scope or delegate.
Do not modify files or external state, even if the runtime grants broader access.
Return only the requested result and essential evidence.
If state changes, material judgment, or architectural reasoning are required,
return NEEDS_ESCALATION with a one-sentence reason.
"""
